# Preset = một combo sẵn: bộ node + model kèm + phiên bản ghim.
#
# Khoá dùng được:
#   nodes:            tên bộ trong nodes.yaml            (bắt buộc)
#   models:           danh sách tên model hoặc URL       (tuỳ chọn)
#   comfy_commit:     ghim commit ComfyUI                (tuỳ chọn)
#   frontend_version: ghim comfyui-frontend-package      (tuỳ chọn)
#   note:             hiện ra khi gọi list_presets()
#
# Để trống comfy_commit/frontend_version = luôn lấy bản mới nhất.
# Khi upstream có regression, điền commit đã chạy được vào đây là xong.
#
# ⚠️ Cân dung lượng: Drive free chỉ 15 GB. Preset nào tổng model vượt ngưỡng
# đó thì phải ghi rõ trong note là cần Model storage = session.

fast:
  nodes: fast
  models: []
  note: Chỉ dựng ComfyUI + node tối thiểu. Tự tải model sau bằng Manager. (~0 GB)

sd15:
  nodes: base
  models:
    - sd15
    - upscale-4x-ultrasharp
  note: SD 1.5 — nhẹ nhất, vừa Drive free. (~4.4 GB)

sdxl:
  nodes: base
  models:
    - sdxl-base
    - sdxl-vae
    - upscale-4x-ultrasharp
  note: SDXL base đủ bộ. Vừa Drive free nhưng sát nút. (~7.3 GB)

flux:
  nodes: base
  models:
    - flux-schnell-fp8
    - upscale-4x-ultrasharp
  note: >-
    Flux schnell fp8 all-in-one. (~17.3 GB) — KHÔNG vừa Drive free,
    chọn Model storage = session.

full:
  nodes: full
  models:
    - sdxl-base
    - sdxl-vae
    - upscale-4x-ultrasharp
  note: Bộ node đầy đủ cho làm việc thật, model như preset sdxl. (~7.3 GB)
